; Loaded after php.ini-production, so only what differs from it is here.

; The container's environment is the configuration; without the E, $_ENV is
; empty and Laravel cannot see it from inside a worker.
variables_order = EGPCS

expose_php = Off

; Rendering a PDF with an embedded logo and signatures, or reading an import
; spreadsheet, is the largest thing a request does.
memory_limit = 256M
max_execution_time = 60

; The application accepts documents up to 5 MB; this leaves room for a form
; that carries several of them.
upload_max_filesize = 16M
post_max_size = 20M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; The code in an image never changes, so there is nothing to check a file's
; timestamp for.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531

; Workers are long-lived, which is where tracing has time to pay for itself.
opcache.jit = tracing
opcache.jit_buffer_size = 64M
